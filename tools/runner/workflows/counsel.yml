# Counsel's acts, made on steel (transcripts/runner/counsel-courier.md). The shell holds trigger, lane,
# permissions, timeout, and one step that fetches tools/runner/counsel-act.py from jack's main at dispatch and runs it.
name: counsel
on:
  push:
    branches: [counsel-requests]
permissions:
  contents: read
jobs:
  act:
    runs-on: [self-hosted, opencode]
    timeout-minutes: 10
    steps:
      - name: Make the requested acts under counsel's account
        env:
          READ_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          GH_TOKEN="$READ_TOKEN" gh api -H 'Accept: application/vnd.github.raw' \
            "repos/renavondata/jack/contents/tools/runner/counsel-act.py?ref=main" > "$RUNNER_TEMP/counsel-act.py"
          python3 "$RUNNER_TEMP/counsel-act.py"
